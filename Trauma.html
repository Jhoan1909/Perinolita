<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Felicidades, Residente! 🦴</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            text-align: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 90%;
            width: 400px;
            margin: 20px;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-pic {
            width: 100%;
            height: auto;
            border-radius: 15px;
            border: 5px solid #00acc1;
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            color: #007c91;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
        }

        .badge {
            background-color: #00acc1;
            color: white;
            padding: 8px 15px;
            border-radius: 50px;
            display: inline-block;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: 25px;
            font-style: italic;
            font-size: 0.9rem;
            color: #888;
        }

        /* Responsive para pantallas muy pequeñas */
        @media (max-width: 380px) {
            h1 { font-size: 1.5rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="lv_0_20260208142406.jpg" alt="Futura Traumatóloga" class="profile-pic">
        
        <h1>¡Felicidades, Mi Perinolita 🦴✨</h1>
        
        <p>Hoy comienza una etapa increíble. Estoy muy orgulloso de verte cumplir este sueño y convertirte en la mejor <b>Residente de Traumatología Mi vidita</b>.</p>
        
        <div class="badge">RA - TRAUMATOLOGÍA</div>

        <p class="footer">¡A romperla (pero no los huesos)! Con mucho amor. ❤️</p>
    </div>

    <script>
        // Función para lanzar el confeti al cargar la página
        window.onload = function() {
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              // Lanza confeti desde dos puntos
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        };
    </script>
</body>
</html>
